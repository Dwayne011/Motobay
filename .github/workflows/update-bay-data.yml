name: Update bay data

# Rebuilds data/uk-bays.json from OpenStreetMap once a week, and whenever the
# script changes. The apps download that file.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_uk_bays.py
      - .github/workflows/update-bay-data.yml

permissions:
  contents: write

concurrency:
  group: update-bay-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the parser
        working-directory: scripts
        run: python -m unittest test_fetch_uk_bays.py
      - name: Fetch UK bays from OpenStreetMap
        run: |
          mkdir -p data
          python scripts/fetch_uk_bays.py data/uk-bays.json
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/uk-bays.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uk-bays.json
          git commit -m "Update UK bay data"
          git pull --rebase origin main
          git push origin HEAD:main
